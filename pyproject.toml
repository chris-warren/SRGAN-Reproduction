[project]
name = "mp3ml"
version = "0.1.0"
description = "Dataset preparation for MP3 compression reversal"
# 3.10 is the real floor and was verified, not guessed: the whole tree compiles
# under python3.10 (`python3.10 -m compileall src scripts tests`), and nothing
# uses a 3.11+ or 3.12+ feature -- no PEP 695 generics, no `type` statement, no
# tomllib, datetime.UTC, StrEnum, ExceptionGroup or itertools.batched. The pin
# said >=3.12 only because that is what was installed here, which blocked a
# cluster module offering 3.11. The test suite is run on 3.12; 3.10 and 3.11
# are compile-verified.
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.13",
    "pyyaml>=6.0",
    # 2.0 is the real floor. `train._grad_scaler` handles both GradScaler
    # spellings, `torch.autocast` is 1.10, `torch.load(weights_only=...)` is
    # 1.13 and `torch.linalg.eigh` is 1.8. This was pinned at >=2.6 for no
    # reason beyond what happened to be installed, which blocked a cluster
    # wheelhouse and the Apollo container's torch 2.0.0 alike.
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Live experiment tracking. The durable record is always JSONL under
# outputs/<run>/, so this is a viewer, not a dependency of the results.
tracking = ["wandb>=0.17"]
# Reading the Apollo corpus (`data.source: apollo`), which is stored as HDF5.
# Optional because the paper's own data path needs nothing beyond the core
# dependencies — see mp3ml.apollo.
apollo = ["h5py>=3.10"]
# Frechet Audio Distance: the distance itself is implemented in mp3ml.metrics
# with no extra dependency, and the VGGish embedder loads through torch.hub,
# so FAD needs no entry here. See mp3ml.fad.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
